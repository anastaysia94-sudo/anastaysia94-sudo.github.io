<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Prompt Pack — AI Revenue Product Factory</title><link rel="stylesheet" href="assets/site.css"></head><body><header class="site-nav"><div class="wrap nav-inner"><a class="brand" href="index.html">AI Revenue Product Factory</a><nav class="nav-links"><a href="index.html">Home</a><a href="workflows.html">Workflows</a><a href="prompts.html">Prompts</a><a href="launch.html">Launch</a><a href="hubspot.html">HubSpot</a><a href="docs.html">Docs</a><a class="nav-cta" href="sales.html">See $297 system</a></nav></div></header><main><section class="hero"><div class="wrap"><p class="eyebrow">15 production prompts</p><h1>Research, package, sell, fulfill, learn.</h1><p>Every prompt is built around the same evidence-first rule: separate observed facts from hypotheses and never invent outcomes.</p></div></section><section class="section"><div class="wrap"><div class="prompt-tools"><label class="sr-only" for="promptSearch">Search prompts</label><input id="promptSearch" type="search" placeholder="Search the production library…" autocomplete="off"></div><div id="promptList"></div></div></section></main><footer class="site-footer"><div class="wrap"><a href="index.html">Home</a> · <a href="sales.html">Sales page</a></div></footer><script>const P=[["01 • Opportunity Research","Research this business problem: [PROBLEM]. Buyer: [BUYER]. Find recurring questions, objections, urgent moments, desired outcomes, current alternatives and evidence that people seek solutions. Separate observed facts from hypotheses. Output: problem statement, buyer language, evidence, monetization paths, competition risks and a testable product angle."],["02 • Opportunity Score","Score [IDEA] from 1–10 for Demand, Momentum, Intent, Monetization, Product Fit, Speed, Differentiation and Competition. Explain every score in one sentence. Produce an internal score and list what evidence would change it."],["03 • Prospect Fit","Given this public business information: [DATA]. Identify only observable fit signals. Do not claim hidden problems. Map the business to the most relevant offer and write a one-sentence rationale."],["04 • One-Page Audit","Create a one-page audit for [BUSINESS] around [OFFER]. Include observed signal, likely workflow gap, what to inspect, questions to ask, quick win and next-step offer. Mark assumptions clearly."],["05 • Personalized Outreach","Write a concise first-touch message for [BUSINESS]. Use only these public facts: [FACTS]. Lead with the operational problem, not AI hype. Offer a free one-page audit. No exaggerated claim, no guaranteed result, no fake personalization."],["06 • Follow-Up","Write three follow-ups for [PROSPECT] after [MESSAGE]. Each should add new value, stay concise and make it easy to say yes or no. Do not guilt, pressure or fabricate urgency."],["07 • Discovery Call","Create 10 discovery questions for [BUSINESS TYPE] that diagnose missed calls, response time, quote follow-up, booking, no-shows, reactivation, reviews and manual admin. Then provide a 5-minute diagnosis script."],["08 • Proposal","Turn these findings into a proposal for [BUSINESS]. Include current-state summary, recommended system, deliverables, implementation sequence, investment, assumptions and success measures. Keep ROI language as a hypothesis, not a promise."],["09 • SOP Builder","Convert this recurring task into a simple SOP: [TASK]. Output trigger, inputs, steps, AI step, human review, QA, exception handling and completion definition."],["10 • Content Atomizer","Turn this real customer question/problem: [QUESTION] into one article, three Facebook posts, three LinkedIn posts, five short-video hooks, one email, one FAQ and one CTA. Keep the language buyer-centered."],["11 • Offer Builder","Create a productized service around [PROBLEM]. Give: name, one-line promise, ideal buyer, deliverables, timeline, price range, exclusions, proof needed, guarantee language to avoid and upsells."],["12 • Case Study Builder","Using only these verified facts: [FACTS], write a case study with baseline, intervention, observed result, limitation and next step. Never invent revenue numbers or attribution."],["13 • HubSpot Activity Summarizer","Summarize this CRM activity history: [ACTIVITY]. Return current stage, buyer intent, objections, next best action, task to create and what not to assume."],["14 • Fulfillment QA","Audit this deliverable against its promised scope: [SCOPE] and [DELIVERABLE]. Check completeness, clarity, consistency, factual support, client-specific details and handoff readiness. Return Pass / Fix with exact corrections."],["15 • Experiment Designer","Create a 48-hour test for [OFFER] aimed at [AUDIENCE]. Define hypothesis, channel, message, sample, metric, target, stop condition and learning decision. Do not use guaranteed outcomes."]];document.getElementById("promptList").innerHTML=P.map((p,i)=>'<article class="card" style="margin-bottom:18px"><span class="tag">'+String(i+1).padStart(2,"0")+'</span><h3>'+p[0]+'</h3><div class="prompt">'+p[1]+'</div><div class="copy-row"><button class="copy" onclick=copyText('+JSON.stringify(p[1])+',"b'+i+'") id="b'+i+'">Copy</button></div></article>').join("");</script><script>document.getElementById("promptSearch").addEventListener("input",function(){var q=this.value.toLowerCase();document.querySelectorAll("#promptList .card").forEach(function(card){card.hidden=q&&!card.innerText.toLowerCase().includes(q)})});</script><script src="assets/site.js"></script></body></html>
